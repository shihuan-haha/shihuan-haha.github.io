<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; }
        .section { margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; }
        code { background: #f4f4f4; padding: 2px 5px; }
    </style>
</head>
<body>

    

    <div class="section">
        <strong>1. All initial properties:</strong>
        <p id="initial-props"></p>
    </div>

    <div class="section">
        <strong>2. Object after deleting age:</strong>
        <pre id="final-object"></pre>
    </div>

    <script>
        var Person = {
            firstName: "Tony",
            lastName: "Lee",
            age: 50,
            eyeColor: "Blue"
        };

        // 1. List all properties
        // Object.keys() returns an array of a given object's own enumerable property names
        const allProperties = Object.keys(Person).join(", ");
        document.getElementById("initial-props").innerText = allProperties;

        // 2. Delete the age property
        delete Person.age;

        // 3. Print the object after deleting the property
        // Using JSON.stringify to make the object readable on the page
        document.getElementById("final-object").innerText = JSON.stringify(Person, null, 4);

        // Also logging to console for verification
        console.log("Initial Properties:", allProperties);
        console.log("Updated Object:", Person);
    </script>
</body>
</html>
