<!DOCTYPE html>
<html>
<head>
   
    <style>
        .spec-button {
            size: h22/R8 = height:22, radius:8
            height: 22px;
            border-radius: 8px;
            border: 1px solid #2f2f2f;
            background-color: #ffffff;
            color: #2f2f2f;
            font-size: 13px;
            padding: 0 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

       
    </style>
</head>
<body>

    <button class="spec-button" onclick="showDetails()">查看資訊</button>

    <div id="spec-info">
        <div>size: h22/R8</div>
        <div>Roboto regular</div>
        <div>outline 1px #2f2f2</div>
         <div style="color: #0084ff;">Font stlye</div>
        <div>Roboto Regular 13px</div>
        <div>color: #ffffff</div>
    </div>
  
      
    

    <script>
        // 3. JavaScript：控制資訊顯示或隱藏
        function showDetails() {
            var info = document.getElementById("spec-info");
            
            // 如果目前是隱藏的，就顯示；如果是顯示的，就隱藏
            if (info.style.display === "none" || info.style.display === "") {
                info.style.display = "block";
            } else {
                info.style.display = "none";
            }
        }
    </script>

</body>
</html>
