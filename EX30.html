<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Button Page</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 50px;
            gap: 20px;
        }
        #text-display {
            font-size: 40px;
            margin: 0;
            color: black; /* Default color */
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1 id="text-display">Hello</h1>
    <button id="action-button">Button</button>

    <script>
        const text = document.getElementById('text-display');
        const btn = document.getElementById('action-button');

        // 1. Mouse over button: Change color to pink
        btn.addEventListener('mouseover', () => {
            text.style.color = 'magenta';
        });

        // Optional: Revert color when mouse leaves (common UX practice)
        btn.addEventListener('mouseout', () => {
            // Only revert if the text hasn't been clicked yet
            if (text.innerText === "Hello") {
                text.style.color = 'black';
            }
        });

        // 2. Mouse click button: Change text content
        btn.addEventListener('click', () => {
            text.innerText = 'Mouse Click';
            text.style.color = 'magenta';
        });
    </script>

</body>
</html>
