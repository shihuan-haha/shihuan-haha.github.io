<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>圓形計算器</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .box { border: 1px solid #ccc; padding: 20px; max-width: 300px; border-radius: 5px; }
        input, button { margin-top: 10px; padding: 8px; width: 100%; box-sizing: border-box; }
        .result { margin-top: 15px; font-weight: bold; color: blue; }
    </style>
</head>
<body>

<div class="box">
    <h3>圓形屬性計算器</h3>
    <label>請輸入半徑 (Radius):</label>
    <input type="number" id="radiusInput" placeholder="例如: 5">
    <button onclick="startCalculate()">點擊計算</button>

    <p id="circOutput">The circumference is NN</p>
    <p id="areaOutput">The area is NN</p>
</div>

<script>
    // 題目要求的第 1 個函數：計算圓周長
    function calcCircumfrence(radius) {
        var circumference = 2 * 3.14159265 * radius;
        // 尋找網頁上的 ID，並把 NN 替換掉
        document.getElementById('circOutput').innerText = "The circumference is " + circumference;
    }

    // 題目要求的第 2 個函數：計算面積
    function calcArea(radius) {
        var area = 3.14159265 * radius * radius;
        // 尋找網頁上的 ID，並把 NN 替換掉
        document.getElementById('areaOutput').innerText = "The area is " + area;
    }

    // 按鈕點擊後觸發的函數
    function startCalculate() {
        // 取得使用者輸入的數字
        var r = document.getElementById('radiusInput').value;
        
        if (r === "" || r <= 0) {
            alert("請輸入大於 0 的有效半徑！");
            return;
        }

        // 把數字轉為浮點數，並丟進題目要求的兩個函數裡
        var radiusNum = parseFloat(r);
        calcCircumfrence(radiusNum);
        calcArea(radiusNum);
    }
</script>

</body>
</html>
