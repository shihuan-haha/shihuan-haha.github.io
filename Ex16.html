<!DOCTYPE html>
<html>
<head>
<style>
p.one {
  border-style: double;
  border-color: orange;
  background-color:lightblue;
}
p.two {
  border-style: solid;
  border-color: lightblue;
  background-color:yellow;
  border-radius:5px;
}
p.three {
  border-style: dotted;
  border-color: gray;
  background-color:green;
}
</style>
</head>
<body>

<p class="one">border-color: orange;background-color:lightblue;</p>
<p class="two">border-color: lightblue; background-color:yellow;</p>
<p class="three">  border-color: gray;background-color:green</p>

</body>
</html>
