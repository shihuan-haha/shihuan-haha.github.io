<!DOCTYPE html>
<html>
<head>
<style>
  
  table, td, th {
  border: 1px solid black;
}
  table {
  border-collapse: collapse;
  width: 50px;
}
  th {
  height: 20px;
  background-color:gray;
}
  td{
      height: 20px;
  }
  tr:nth-child(even){background-color:yellow;}
  
div.fixed {
  position:absolute;
  top:0;
  right:200px;
  width: 100px;
  height: 100px;
  border: 1px solid green;
} 


</style>
</head>
<body>
  
<table>
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
  </tr>
  <tr>
    <td>1</td>
    <td>1</td>
  </tr>
  <tr>
    <td>2</td>
    <td>2</td>
  </tr>
  <tr>
    <td>3</td>
    <td>3</td>
  </tr>
 
</table>

  <div class="fixed">This div element has position: fixed;</div>
</div>
  
</body>
</html>
