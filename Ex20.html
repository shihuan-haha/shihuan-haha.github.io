<!DOCTYPE html>
<html>
<head>
<style>
  
  table, td, th {
  border: 1px solid black;
}
  table {
  border-collapse: collapse;
  width: 100%;
}
  th {
  height: 70px;
}
  
div.fixed {
  position: relative;
  width: 400px;
  height: 200px;
  border: 3px solid green;
} 


</style>
</head>
<body>
  
<table>
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
  </tr>
  <tr>
    <td>1</td>
    <td>1</td>
  </tr>
  <tr>
    <td>2</td>
    <td>2</td>
  </tr>
  <tr>
    <td>3</td>
    <td>3</td>
  </tr>
 
</table>

  <div class="fixed">This div element has position: fixed;</div>
</div>
  
</body>
</html>
