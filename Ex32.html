<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <style>
       

        /* 中圖：正圓形，150x150px，不變形 */
        .img-center {
            width: 150px;
            height: 150px; 
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* 加點陰影更好看 */
        }

        
    </style>
</head>
<body>

    <div class="container">
        
        <img src="console.png"  class="img-center">
        
    </div>

</body>
</html>
